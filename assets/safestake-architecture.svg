tion</text><text x="584.0" y="116.0" text-anchor="middle" class="s">Chainlink VRF</text><line x1="654" y1="102" x2="680" y2="102" stroke="#1e56b8" stroke-width="1.6" marker-end="url(#a)"/><rect x="682" y="60" width="136" height="84" rx="8" fill="#eaf1fb" stroke="#c9d6ea"/><text x="750.0" y="97.0" text-anchor="middle" class="h">Governance Vote</text><text x="750.0" y="116.0" text-anchor="middle" class="s">Governor contract</text><line x1="820" y1="102" x2="846" y2="102" stroke="#1e56b8" stroke-width="1.6" marker-end="url(#a)"/><rect x="848" y="60" width="136" height="84" rx="8" fill="#dbe7f8" stroke="#c9d6ea"/><text x="916.0" y="97.0" text-anchor="middle" class="h">Fund Release</text><text x="916.0" y="116.0" text-anchor="middle" class="s">Automated payout</text><rect x="184" y="225" width="136" height="72" rx="8" fill="#fff" stroke="#c9d6ea" stroke-dasharray="5 4"/><text x="252.0" y="256.0" text-anchor="middle" class="h">Token Factory</text><text x="252.0" y="275.0" text-anchor="middle" class="s">Project ERC-20</text><line x1="252.0" y1="146" x2="252.0" y2="223" stroke="#1e56b8" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#a)"/><rect x="350" y="225" width="136" height="72" rx="8" fill="#fff" stroke="#c9d6ea" stroke-dasharray="5 4"/><text x="418.0" y="256.0" text-anchor="middle" class="h">IPFS</text><text x="418.0" y="275.0" text-anchor="middle" class="s">Milestone documents</text><line x1="418.0" y1="146" x2="418.0" y2="223" stroke="#1e56b8" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#a)"/><rect x="18" y="225" width="136" height="72" rx="8" fill="#fff" stroke="#c9d6ea" stroke-dasharray="5 4"/><text x="86.0" y="256.0" text-anchor="middle" class="h">MetaMask</text><text x="86.0" y="275.0" text-anchor="middle" class="s">Wallet and signing</text><line x1="86.0" y1="146" x2="86.0" y2="223" stroke="#1e56b8" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#a)"/><rect x="516" y="225" width="302" height="72" rx="8" fill="#fff" stroke="#