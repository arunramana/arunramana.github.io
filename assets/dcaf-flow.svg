<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" role="img" aria-labelledby="t d"><title id="t">DCAF extension flow</title><desc id="d">The extension compares the user's stated browsing intent with the visited page using the Gemini API and returns an alignment verdict.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1e56b8"/></marker></defs><rect width="1000" height="280" fill="#ffffff"/><style>text{font-family:Inter,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}.h{font-size:15px;font-weight:600;fill:#0f2a4a}.s{font-size:12.5px;fill:#5b6678}.c{font-size:12px;font-weight:600;fill:#1e56b8;letter-spacing:.08em}</style><text x="10" y="28" class="c" text-anchor="start">CHROME EXTENSION FLOW</text><rect x="15" y="60" width="230" height="70" rx="8" fill="#eaf1fb" stroke="#c9d6ea"/><text x="130.0" y="90.0" text-anchor="middle" class="h">Stated Intent</text><text x="130.0" y="109.0" text-anchor="middle" class="s">What the user plans to do</text><rect x="15" y="160" width="230" height="70" rx="8" fill="#eaf1fb" stroke="#c9d6ea"/><text x="130.0" y="190.0" text-anchor="middle" class="h">Visited Page</text><text x="130.0" y="209.0" text-anchor="middle" class="s">Website being visited</text><rect x="330" y="95" width="250" height="100" rx="8" fill="#dbe7f8" stroke="#c9d6ea"/><text x="455.0" y="131.0" text-anchor="middle" class="h">Gemini API</text><text x="455.0" y="150.0" text-anchor="middle" class="s">Judges whether the page</text><text x="455.0" y="169.0" text-anchor="middle" class="s">supports the intent</text><line x1="237" y1="95" x2="328" y2="130" stroke="#1e56b8" stroke-width="1.6" marker-end="url(#a)"/><line x1="237" y1="195" x2="328" y2="160" stroke="#1e56b8" stroke-width="1.6" marker-end="url(#a)"/><rect x="675" y="60" width="310" height="70" rx="8" fill="#fff" stroke="#c9d6ea"/><text x="830.0" y="90.0" text-anchor="middle" class="h">Aligned</text><text x="830.0" y="109.0" text-anchor="middle" class="s">Matches stated intent</text><rect x="675" y="160" width="310" height="70" rx="8" fill="#fff" stroke="#c9d6ea"/><text x="830.0" y="190.0" text-anchor="middle" class="h">Not Aligned</text><text x="830.0" y="209.0" text-anchor="middle" class="s">Does not match stated intent</text><line x1="582" y1="130" x2="673" y2="97" stroke="#1e56b8" stroke-width="1.6" marker-end="url(#a)"/><line x1="582" y1="160" x2="673" y2="195" stroke="#1e56b8" stroke-width="1.6" marker-end="url(#a)"/></svg>