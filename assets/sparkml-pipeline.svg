<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" role="img" aria-labelledby="t d"><title id="t">Spark ML pipeline</title><desc id="d">Survey data flows through feature engineering, model training and validation to produce voter language predictions.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1e56b8"/></marker></defs><rect width="1000" height="200" fill="#ffffff"/><style>text{font-family:Inter,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}.h{font-size:15px;font-weight:600;fill:#0f2a4a}.s{font-size:12.5px;fill:#5b6678}.c{font-size:12px;font-weight:600;fill:#1e56b8;letter-spacing:.08em}</style><text x="10" y="28" class="c" text-anchor="start">PREDICTION PIPELINE</text><rect x="15" y="58" width="150" height="100" rx="8" fill="#eaf1fb" stroke="#c9d6ea"/><text x="90.0" y="94.0" text-anchor="middle" class="h">Survey Data</text><text x="90.0" y="113.0" text-anchor="middle" class="s">Massachusetts voter</text><text x="90.0" y="132.0" text-anchor="middle" class="s">table</text><line x1="168" y1="108" x2="217" y2="108" stroke="#1e56b8" stroke-width="1.6" marker-end="url(#a)"/><rect x="220" y="58" width="150" height="100" rx="8" fill="#eaf1fb" stroke="#c9d6ea"/><text x="295.0" y="94.0" text-anchor="middle" class="h">Feature Engineering</text><text x="295.0" y="113.0" text-anchor="middle" class="s">Engineered</text><text x="295.0" y="132.0" text-anchor="middle" class="s">model inputs</text><line x1="373" y1="108" x2="422" y2="108" stroke="#1e56b8" stroke-width="1.6" marker-end="url(#a)"/><rect x="425" y="58" width="150" height="100" rx="8" fill="#eaf1fb" stroke="#c9d6ea"/><text x="500.0" y="94.0" text-anchor="middle" class="h">Model Training</text><text x="500.0" y="113.0" text-anchor="middle" class="s">Spark ML</text><text x="500.0" y="132.0" text-anchor="middle" class="s">classifier</text><line x1="578" y1="108" x2="627" y2="108" stroke="#1e56b8" stroke-width="1.6" marker-end="url(#a)"/><rect x="630" y="58" width="150" height="100" rx="8" fill="#eaf1fb" stroke="#c9d6ea"/><text x="705.0" y="94.0" text-anchor="middle" class="h">Validation</text><text x="705.0" y="113.0" text-anchor="middle" class="s">Model performance</text><text x="705.0" y="132.0" text-anchor="middle" class="s">checks</text><line x1="783" y1="108" x2="832" y2="108" stroke="#1e56b8" stroke-width="1.6" marker-end="url(#a)"/><rect x="835" y="58" width="150" height="100" rx="8" fill="#dbe7f8" stroke="#c9d6ea"/><text x="910.0" y="94.0" text-anchor="middle" class="h">Prediction</text><text x="910.0" y="113.0" text-anchor="middle" class="s">Voter language</text><text x="910.0" y="132.0" text-anchor="middle" class="s">preference</text></svg>